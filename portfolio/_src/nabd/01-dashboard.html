<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="nabd.css">
<script src="../_shared/lucide.min.js"></script><script src="../_shared/charts.js"></script><script src="layout.js"></script>
<style>
.k4{grid-template-columns:repeat(4,1fr)}
.r2{grid-template-columns:1fr 470px;margin-top:18px}
.r3{grid-template-columns:1fr 360px 390px;margin-top:18px}
.pl td{white-space:nowrap}.pl td:first-child{white-space:normal}
.pl td{padding:9px 14px}
.pn{display:flex;align-items:center;gap:12px}.pn .pi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.pn .pi svg{width:18px;height:18px}
.pn b{font-size:14px;font-weight:600;display:block}.pn span{font-size:12px;color:var(--muted)}
.pc{display:flex;align-items:center;gap:10px}.pc .prog{flex:1;width:130px}.pc b{font-family:Inter;font-size:13px;width:36px}
.wl{display:flex;flex-direction:column;gap:13px}
.wl .row{display:flex;align-items:center;gap:12px}.wl .row div{flex:1}.wl .row b{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between}
.wl .row b span{font-family:Inter;color:var(--muted);font-weight:500;font-size:12.5px}.wl .prog{margin-top:7px;height:7px}
.dl{display:flex;flex-direction:column;gap:10px}
.dl .it{display:flex;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px}
.dl .d{width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.dl .d b{font-family:Inter;font-size:18px;line-height:1}.dl .d span{font-size:11px;margin-top:3px}
.dl .it div.t{flex:1;min-width:0}.dl .it div.t b{font-size:13.5px;display:block;font-weight:600}.dl .it div.t span{font-size:12px;color:var(--muted)}
.st{display:flex;flex-direction:column;gap:12px;flex:1}
.st div{display:flex;align-items:center;gap:10px;font-size:14px}.st i{width:11px;height:11px;border-radius:4px}.st b{margin-inline-start:auto;font-family:Inter;font-size:14px}.st em{font-style:normal;color:var(--muted);font-family:Inter;font-size:12.5px;width:40px;text-align:left}
.tip{position:absolute;background:#0F172A;color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;box-shadow:0 10px 25px rgba(15,23,42,.25)}
.tip b{display:block;margin-bottom:6px;font-size:13px}.tip div{display:flex;align-items:center;gap:8px;margin-top:3px}.tip i{width:8px;height:8px;border-radius:50%}
.tip .en{margin-inline-start:14px;font-weight:600}
</style></head><body><script>

 </div>
</div>
<div class="grid r3">
 <div class="card" style="padding:22px 0 6px"><div class="ch" style="padding:0 22px;margin-bottom:12px"><div><h3>تقدم المشاريع</h3><div class="sub">المشاريع ذات الأولوية هذا الربع</div></div><div class="r"><span style="color:var(--brand);font-size:13.5px;font-weight:600">عرض الكل</span></div></div>
  <table class="pl"><thead><tr><th>المشروع</th><th>الفريق</th><th>التسليم</th><th>الحالة</th><th>الإنجاز</th></tr></thead><tbody>

     ['15','نوفمبر','#FFFBEB','#B45309','اعتماد خطة المحتوى الإعلاني','حملة الربع الرابع · هيا المطيري','t-amber','3 أيام'],

 </div>

Charts.line(document.getElementById('ch1'), {w: 1040, h: 236, labels: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر'], max: 200, ticks: 4,

[[14,16,15,18,19,21,20,24],[60,70,66,80,78,90,96,104],[62,64,68,67,71,73,76,78],[22,25,21,19,20,18,15,17]].forEach((d,i)=>Charts.spark(document.getElementById('sp'+i),{w:80,h:30,data:d,color:['#4F46E5','#059669','#0EA5E9','#E11D48'][i]}));
