<style>
.k4{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.kp{padding:20px 22px;position:relative;overflow:hidden}
.kp .h{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.kp .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}.kp .ic svg{width:21px;height:21px}
.kp .v{font-family:Inter;font-size:31px;font-weight:700;margin-top:14px;display:flex;align-items:baseline;gap:8px}
.kp .v small{font-size:14px;font-family:'Readex Pro';font-weight:500;color:var(--muted)}
.kp .f{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px}
.kp.hero{background:linear-gradient(140deg,#0D9488,#0F766E);border:0;color:#fff}
.kp.hero .h,.kp.hero .f,.kp.hero .v small{color:#CCFBF1}.kp.hero .ic{background:rgba(255,255,255,.16);color:#fff}
.kp.hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.07);left:-60px;bottom:-90px}
.lay{display:grid;grid-template-columns:1fr 470px;gap:20px}
.left{display:grid;gap:20px;grid-template-rows:auto 1fr}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ap{display:flex;flex-direction:column}
.ap .it{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:center}
.ap .tm{width:58px;text-align:center;flex-shrink:0}.ap .tm b{font-family:Inter;font-size:15px;display:block}.ap .tm span{font-size:11.5px;color:var(--muted)}
.ap .bar{width:4px;align-self:stretch;border-radius:4px}
.ap .bd{flex:1;min-width:0}.ap .bd b{font-size:14px;font-weight:500;display:block}.ap .bd span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:3px}
.ap .now{background:var(--brand-50);border-radius:14px;padding:12px 12px;border:1px solid var(--brand-100);margin:6px 0}
.sv{display:flex;flex-direction:column;gap:14px}

.sv .prog{margin-top:7px;height:8px}

.src{display:flex;align-items:center;gap:22px}
.src .l{flex:1;display:flex;flex-direction:column;gap:12px}
