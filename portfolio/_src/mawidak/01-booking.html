<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="mawidak.css">
<script src="../_shared/lucide.min.js"></script><script src="layout.js"></script>
<style>
body{background:#F6F8F7}
.hero{height:230px;background:linear-gradient(120deg,#0F766E 0%,#0D9488 55%,#14B8A6 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;border:70px solid rgba(255,255,255,.06);left:-120px;top:-220px}
.hero::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(240,101,72,.18);left:380px;top:120px;filter:blur(40px)}
.nav{height:72px;display:flex;align-items:center;padding:0 120px;gap:18px;position:relative;z-index:2;color:#CCFBF1;font-size:14.5px}
.nav .lg{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:20px}
.nav .lg span{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.nav a{color:#E6FFFA}
.nav .pw{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;background:rgba(255,255,255,.12);padding:7px 13px;border-radius:30px}
.nav .bt{background:#fff;color:var(--brand-700);padding:9px 18px;border-radius:12px;font-weight:500;display:flex;gap:7px;align-items:center}
.wrap{padding:0 120px;margin-top:-150px;position:relative;z-index:3}
.clinic{display:flex;align-items:center;gap:20px;color:#fff;margin-bottom:18px}
.clinic .ph{width:72px;height:72px;border-radius:22px;background:#fff;display:grid;place-items:center;color:var(--brand);box-shadow:0 12px 30px rgba(0,0,0,.15)}
.clinic .ph svg{width:42px;height:42px;stroke-width:1.6}
.clinic h1{font-size:28px;font-weight:600}
.clinic .m{display:flex;gap:18px;font-size:14px;color:#CCFBF1;margin-top:6px}.clinic .m span{display:flex;align-items:center;gap:6px}.clinic .m svg{width:16px;height:16px}
.clinic .st{color:#FDE68A}
.steps{background:#fff;border-radius:18px;padding:14px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(16,32,30,.08);margin-bottom:18px}
.stp{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted)}
.stp i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:Inter;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:#fff}
.stp.done{color:var(--ink)}.stp.done i{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand)}
.stp.cur{color:var(--ink);font-weight:600}.stp.cur i{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--brand-100)}
.ln{flex:1;height:2px;background:var(--line);border-radius:2px}.ln.done{background:var(--brand)}
.cols{display:grid;grid-template-columns:1fr 430px;gap:22px}
.sec{background:#fff;border-radius:18px;border:1px solid var(--line);padding:16px 22px;margin-bottom:14px}
.sec h3{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec h3 .n{width:26px;height:26px;border-radius:8px;background:var(--brand-50);color:var(--brand);font-family:Inter;font-size:13px;display:grid;place-items:center}
.sec h3 .ed{margin-inline-start:auto;font-size:13px;color:var(--brand);font-weight:500;display:flex;gap:5px;align-items:center}
.picked{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:14px}
.picked .ic{width:46px;height:46px;border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--brand)}
.picked b{font-weight:500;display:block}.picked span{font-size:12.5px;color:var(--muted)}
.docs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}
.doc{border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center;position:relative}
.doc.on{border-color:var(--brand);background:linear-gradient(180deg,#F0FDFA,#fff);box-shadow:0 8px 22px rgba(13,148,136,.15)}
.doc .chk{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}.doc .chk svg{width:13px;height:13px;stroke-width:3}
.doc .pic{width:50px;height:50px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:600}
.doc b{display:block;font-weight:600;font-size:14.5px}.doc span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.doc .rt{display:flex;justify-content:center;gap:10px;margin-top:6px;font-size:12px;color:var(--ink-2)}.doc .rt em{font-style:normal;display:flex;align-items:center;gap:3px;font-family:Inter}.doc .rt svg{width:13px;height:13px}
.doc .nx{margin-top:8px;font-size:12px;background:var(--bg);border-radius:8px;padding:5px;color:var(--brand-700)}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:10px}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.mc span{font-size:12px;color:var(--faint);padding:2px 0}
.mc b{font-family:Inter;font-weight:500;font-size:14px;height:42px;display:grid;place-items:center;border-radius:11px;position:relative}
.mc b.x{color:#C8D2D0;text-decoration:line-through;text-decoration-color:#E0E7E5}
.mc b.av{background:var(--brand-50);color:var(--brand-700)}
.mc b.lo::after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--coral)}
.mc b.sel{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(13,148,136,.3)}
.mc b.td{outline:1.5px dashed var(--brand);outline-offset:-1.5px}
.slots h4{font-size:13.5px;color:var(--muted);font-weight:500;margin:4px 0 10px;display:flex;align-items:center;gap:6px}.slots h4 svg{width:16px;height:16px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sg b{height:42px;border:1.5px solid var(--line);border-radius:12px;display:grid;place-items:center;font-family:Inter;font-weight:500;font-size:14px}
.sg b.x{background:var(--bg);color:#C8D2D0;border-color:transparent;text-decoration:line-through}
.sg b.sel{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 8px 18px rgba(240,101,72,.3)}
.sum{background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden;box-shadow:0 18px 40px rgba(16,32,30,.06)}
.sum .top2{background:linear-gradient(135deg,#FFF1EE,#FFF7F5);padding:20px 22px;display:flex;gap:14px;align-items:center}
.sum .top2 .ic{width:56px;height:56px;border-radius:16px;background:var(--coral);color:#fff;display:grid;place-items:center}.sum .top2 .ic svg{width:28px;height:28px}
.sum .row{display:flex;align-items:center;gap:12px;padding:10px 22px;font-size:14px}
.sum .row svg{color:var(--muted);width:18px;height:18px}.sum .row span{color:var(--muted)}.sum .row b{margin-inline-start:auto;font-weight:500}
.sum hr{border:0;border-top:1px dashed var(--line);margin:6px 22px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 22px 4px}
.pay div{border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.pay div.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand-700);font-weight:500}
.pay svg{width:17px;height:17px}
.tot{display:flex;align-items:baseline;padding:14px 22px 6px}.tot span{font-size:15px;font-weight:500}.tot b{margin-inline-start:auto;font-family:Inter;font-size:28px;font-weight:700}.tot b small{font-family:'Readex Pro';font-size:14px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.cta{margin:12px 22px 0;height:54px;border-radius:15px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:500;box-shadow:0 12px 24px rgba(13,148,136,.3)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);padding:14px 22px 20px;line-height:1.7}.note svg{width:16px;height:16px;color:var(--brand);flex-shrink:0;margin-top:3px}
</style></head><body><script>
document.body.innerHTML = `
<div class="hero"><div class="nav"><div class="lg"><span><i data-lucide="smile-plus"></i></span>بسمة</div><a>الخدمات</a><a>الأطباء</a><a>العروض</a><a>تواصل معنا</a>
 <div class="pw"><i data-lucide="calendar-heart" style="width:15px;height:15px"></i>الحجز عبر منصة موعدك</div><a style="display:flex;gap:6px;align-items:center"><i data-lucide="globe" style="width:16px;height:16px"></i>English</a><a class="bt"><i data-lucide="user-round" style="width:16px;height:16px"></i>حجوزاتي</a></div></div>
<div class="wrap">
 <div class="clinic"><div class="ph"><i data-lucide="smile-plus"></i></div><div><h1>عيادات بسمة لطب الأسنان</h1>
  <div class="m"><span class="st"><i data-lucide="star" style="fill:#FDE68A"></i>4.9 <span style="color:#CCFBF1">(1,284 تقييمًا)</span></span><span><i data-lucide="map-pin"></i>الرياض — حي الملقا، طريق أنس بن مالك</span><span><i data-lucide="clock-3"></i>السبت – الخميس، 9 ص – 9 م</span><span><i data-lucide="badge-check"></i>منشأة مرخصة من وزارة الصحة</span></div></div></div>
 <div class="steps">
  <div class="stp done"><i>✓</i>اختيار الخدمة</div><div class="ln done"></div>
  <div class="stp done"><i>✓</i>اختيار الطبيب</div><div class="ln done"></div>

  <div class="stp"><i>5</i>تأكيد الحجز</div>
 </div>
 <div class="cols">
  <div>
   <div class="sec" style="padding:16px 22px"><h3><span class="n">1</span>الخدمة المختارة<span class="ed"><i data-lucide="pencil" style="width:14px;height:14px"></i>تغيير</span></h3>
    <div class="picked" style="margin-top:12px"><span class="ic"><i data-lucide="sun"></i></span><div><b>تبييض الأسنان بتقنية الليزر</b><span>جلسة واحدة · 60 دقيقة · تشمل الفحص والتنظيف المبدئي</span></div><b class="num" style="margin-inline-start:auto;font-size:17px">900 <span>ر.س</span></b></div></div>
   <div class="sec"><h3><span class="n">2</span>اختر الطبيب</h3>

     ${[['muna','4.9','312',1,'أقرب موعد: اليوم 6:00 م'],['salman','4.8','268',0,'أقرب موعد: غدًا 10:00 ص'],['ahmad','4.9','405',0,'أقرب موعد: السبت 9:30 ص'],['layla','4.7','189',0,'أقرب موعد: الأحد 11:00 ص']]
      .map(([k,r,n,on,nx])=>`<div class="doc ${on?'on':''}">${on?'<span class="chk"><i data-lucide="check"></i></span>':''}<div class="pic" style="background:linear-gradient(135deg,${DOC[k].c},${DOC[k].c}CC)">${DOC[k].i}</div><b>${DOC[k].n}</b><span>${DOC[k].s}</span><div class="rt"><em><i data-lucide="star" style="color:#F59E0B;fill:#F59E0B"></i>${r}</em><em>${n} مراجعة</em></div><div class="nx">${nx}</div></div>`).join('')}
    </div></div>
   <div class="sec" style="margin-bottom:0"><h3><span class="n">3</span>اختر التاريخ والوقت<span style="margin-inline-start:auto;font-size:12.5px;color:var(--muted);font-weight:400;display:flex;gap:14px"><span style="display:flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:3px;background:var(--brand-50);border:1px solid var(--brand-100)"></i>متاح</span><span style="display:flex;gap:6px;align-items:center"><i style="width:6px;height:6px;border-radius:50%;background:var(--coral)"></i>أماكن محدودة</span></span></h3>
    <div class="dt">
     <div><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b style="font-weight:600">نوفمبر 2026</b><span style="margin-inline-start:auto;display:flex;gap:8px;color:var(--muted)"><i data-lucide="chevron-right"></i><i data-lucide="chevron-left"></i></span></div>
      <div class="mc">${['سبت','أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(x=>`<span>${x}</span>`).join('')}
      <b></b>${Array.from({length:30},(_,i)=>i+1).map(d=>{const dow=(d)%7; /* Nov1=Sun -> index1 */ const fri=((d+1)%7)===0;
        let cls = d<12||fri ? 'x' : 'av'; if([12].includes(d)) cls+=' td'; if([15].includes(d)) cls='av sel'; if([14,18,21].includes(d)) cls+=' lo'; if(d===19) cls='x';
        return `<b class="${cls}">${d}</b>`}).join('')}</div></div>
     <div class="slots"><div style="display:flex;align-items:center;margin-bottom:12px"><b style="font-weight:600">الأحد، 15 نوفمبر</b><span style="margin-inline-start:auto;font-size:12.5px;color:var(--muted)">7 مواعيد متاحة</span></div>
      <h4><i data-lucide="sunrise"></i>الفترة الصباحية</h4>

      <h4><i data-lucide="sunset"></i>الفترة المسائية</h4>
      <div class="sg" style="margin-bottom:0">${['04:00','04:30','05:00','05:30','06:00','06:30','07:00','07:30'].map((t,i)=>`<b class="${i===2?'sel':[3,5,7].includes(i)?'x':''}">${t}</b>`).join('')}</div>
     </div>
    </div></div>
  </div>
  <div class="sum">
   <div class="top2"><span class="ic"><i data-lucide="calendar-check-2"></i></span><div><b style="font-size:17px;font-weight:600;display:block">ملخص الحجز</b><span style="font-size:12.5px;color:var(--muted)">راجع تفاصيل موعدك قبل المتابعة</span></div></div>
   <div style="padding-top:8px">
    <div class="row"><i data-lucide="sparkles"></i><span>الخدمة</span><b>تبييض الأسنان بالليزر</b></div>
    <div class="row"><i data-lucide="stethoscope"></i><span>الطبيب</span><b>د. منى الحارثي</b></div>
    <div class="row"><i data-lucide="calendar"></i><span>التاريخ</span><b>الأحد، 15 نوفمبر 2026</b></div>
    <div class="row"><i data-lucide="clock-3"></i><span>الوقت</span><b>05:00 مساءً (60 دقيقة)</b></div>
    <div class="row"><i data-lucide="map-pin"></i><span>الفرع</span><b>فرع الملقا — الرياض</b></div>
    <hr>
    <div class="row"><span>سعر الخدمة</span><b class="num">900.00 ر.س</b></div>
    <div class="row"><span>خصم الزيارة الأولى (10%)</span><b class="num" style="color:#047857"><bdi dir="ltr">−90.00</bdi> ر.س</b></div>
    <div class="row"><span>ضريبة القيمة المضافة (15%)</span><b class="num">121.50 ر.س</b></div>
    <hr>
    <div class="tot"><span>الإجمالي</span><b>931.50<small>ر.س</small></b></div>
    <div class="pay"><div class="on"><i data-lucide="credit-card"></i>الدفع الإلكتروني</div><div><i data-lucide="building-2"></i>الدفع في العيادة</div></div>
    <div class="cta">متابعة إلى بياناتك<i data-lucide="arrow-left"></i></div>
    <div class="note"><i data-lucide="shield-check"></i>إلغاء أو تعديل مجاني حتى 24 ساعة قبل الموعد، وسيصلك تذكير عبر واتساب والرسائل النصية.</div>
   </div>
  </div>
 </div>
</div>`;
icons();
</script></body></html>
