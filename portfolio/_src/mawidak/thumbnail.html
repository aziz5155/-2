<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../_shared/fonts.css"><script src="../_shared/lucide.min.js"></script>
<style>
:root{--brand:#0D9488;--brand2:#0F766E;--dark:#10201E;--dark2:#115E59;--soft:#F0FDFA;--accent:#F06548;--ink:#10201E;--muted:#6B7A78;--line:#E6ECEB;--bg:#F6F8F7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Readex Pro',sans-serif;direction:rtl;color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-family:Inter,'Readex Pro',sans-serif}
svg.lucide{stroke-width:1.9}
.mark{display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.frame{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.05)}
.frame .bar{height:26px;background:#F1F5F9;display:flex;align-items:center;gap:6px;padding:0 12px;direction:ltr}
.frame .bar i{width:9px;height:9px;border-radius:50%;display:inline-block}
.frame .bar span{margin-left:14px;height:15px;flex:1;max-width:260px;background:#fff;border-radius:5px;font:10px Inter;color:#94A3B8;display:flex;align-items:center;padding:0 8px}
.frame img{display:block;width:100%}

html,body{width:1280px;height:720px;overflow:hidden}
.wrap{position:relative;width:1280px;height:720px;background:radial-gradient(700px 480px at 10% 10%,rgba(20,184,166,.28),transparent 60%),radial-gradient(500px 400px at 0% 100%,rgba(240,101,72,.22),transparent 60%),linear-gradient(135deg,#F0FDFA,#FFFFFF 60%);overflow:hidden}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(13,148,136,.13) 1.2px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(90deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(270deg,#000 0%,transparent 75%)}
.txt{position:absolute;right:70px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;color:var(--ink)}
.logo{display:flex;align-items:center;gap:16px}
.logo .mark{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.logo .mark svg{width:42px;height:42px;stroke-width:2.2}
.logo b{font-size:78px;font-weight:700;line-height:1;letter-spacing:-1px}
.tl{font-size:30px;font-weight:600;margin-top:22px;line-height:1.45}
.ds{font-size:17px;color:var(--brand2);margin-top:10px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chips span{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 4px 12px rgba(16,32,30,.05);padding:9px 15px;border-radius:12px;font-size:15px;display:flex;align-items:center;gap:8px}
.chips svg{width:17px;height:17px;color:var(--brand)}
.foot{margin-top:30px;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.s1{position:absolute;left:-40px;top:92px;width:700px;transform:perspective(1600px) rotateY(14deg) rotateX(4deg);transform-origin:left center}
.s2{position:absolute;left:300px;top:395px;width:390px;transform:perspective(1600px) rotateY(14deg) rotateX(4deg)}
.glow{position:absolute;left:120px;top:160px;width:520px;height:420px;border-radius:50%;background:var(--brand);filter:blur(120px);opacity:0.18}

</style></head><body><div class="wrap"><div class="grid"></div><div class="glow"></div>
<div class="s1"><div class="frame"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span>mawidak.example/basma</span></div><img src="../../02-mawidak-booking-platform/screens/03-dashboard.png"></div></div>
<div class="s2"><div class="frame"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span>mawidak.example/basma</span></div><img src="../../02-mawidak-booking-platform/screens/01-booking.png"></div></div>
<div class="txt"><div class="logo"><div class="mark"><i data-lucide="calendar-heart"></i></div><b>موعدك</b></div>
<div class="tl">منصة حجز وإدارة المواعيد</div>
<div class="ds">منصة SaaS عربية لاستقبال الحجوزات وإدارة التقويم ومقدمي الخدمة والعملاء</div>
<div class="chips"><span><i data-lucide="calendar-plus"></i>صفحة حجز للعملاء</span><span><i data-lucide="calendar-days"></i>تقويم أسبوعي ذكي</span><span><i data-lucide="layout-grid"></i>لوحة تحكم الحجوزات</span><span><i data-lucide="contact-round"></i>إدارة الخدمات والعملاء</span></div>
<div class="foot"><i></i>تصميم واجهات UI/UX<i></i>لوحة تحكم<i></i>نموذج تصميمي</div></div>
</div><script>lucide.createIcons()</script></body></html>
