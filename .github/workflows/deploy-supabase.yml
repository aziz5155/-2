name: Deploy Supabase backend (Edge Functions + migrations)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-child --project-ref bktcmbazucbfimqgziws
          supabase functions deploy child-login --project-ref bktcmbazucbfimqgziws
          supabase functions deploy reset-child-pin --project-ref bktcmbazucbfimqgziws

      - name: Push database migrations (optional — needs SUPABASE_DB_URL secret)
        if: ${{ vars.SKIP_DB_PUSH != 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret not set — skipping database migrations. Edge Functions above still deployed."
            exit 0
          fi
          supabase db push --db-url "$SUPABASE_DB_URL"
